spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:10.9.107.50}:${DB_PORT:3306}/${DB_NAME:xiaoyu_yinran}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: never

app:
  jwt-secret: ${JWT_SECRET:}
  upload-root: ${UPLOAD_ROOT:/mnt/cos/uploads}
  storage-mode: ${STORAGE_MODE:cos}
  cos-bucket: ${COS_BUCKET:}
  cos-region: ${COS_REGION:}
  cos-key-prefix: ${COS_KEY_PREFIX:uploads}
  cos-secret-id: ${COS_SECRET_ID:}
  cos-secret-key: ${COS_SECRET_KEY:}
  cos-signed-url-seconds: ${COS_SIGNED_URL_SECONDS:86400}
  wechat-app-id: ${WECHAT_APP_ID:}
  wechat-app-secret: ${WECHAT_APP_SECRET:}
  wechat-miniprogram-state: ${WECHAT_MINIPROGRAM_STATE:developer}
  new-product-template-id: ${NEW_PRODUCT_TEMPLATE_ID:}
  public-file-base-url: ${PUBLIC_FILE_BASE_URL:}
  default-admin-username: ${DEFAULT_ADMIN_USERNAME:admin}
  default-admin-password: ${DEFAULT_ADMIN_PASSWORD:admin123}
  visit-event-retention-days: ${VISIT_EVENT_RETENTION_DAYS:180}
