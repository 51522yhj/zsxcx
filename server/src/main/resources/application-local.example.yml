spring:
  config:
    activate:
      on-profile: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/xiaoyu_yinran?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: "your-local-mysql-password"
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      continue-on-error: true

app:
  jwt-secret: ${JWT_SECRET:replace-with-a-long-local-secret}
  upload-root: ${UPLOAD_ROOT:uploads}
  storage-mode: ${STORAGE_MODE:local}
  public-file-base-url: ${PUBLIC_FILE_BASE_URL:http://127.0.0.1:8080/uploads}
  cos-bucket: ${COS_BUCKET:yhj-1328692606}
  cos-region: ${COS_REGION:ap-guangzhou}
  cos-key-prefix: ${COS_KEY_PREFIX:uploads}
  cos-secret-id: ${COS_SECRET_ID:}
  cos-secret-key: ${COS_SECRET_KEY:}
  cos-custom-domain: ${COS_CUSTOM_DOMAIN:img.fuzhuangzhanshi.online}
  cos-signed-url-seconds: ${COS_SIGNED_URL_SECONDS:86400}
  wechat-app-id: ${WECHAT_APP_ID:}
  wechat-app-secret: ${WECHAT_APP_SECRET:}
  new-product-template-id: ${NEW_PRODUCT_TEMPLATE_ID:}
  default-admin-username: admin
  default-admin-password: admin123
  visit-event-retention-days: 180
